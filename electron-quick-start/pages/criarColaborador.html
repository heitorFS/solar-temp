<div class="form-container">
    <form class="form">
        <input id="id" value="0" hidden />
        <div class="field">
            <label>Nome</label>
            <input id="nome" type="text" required />
        </div>
        <div class="field">
            <label>Cargo</label>
            <select id="id_cargo" required>
                <option value="1">Vendedor</option>
                <option value="2">Projetista</option>
                <option value="3">Instalador</option>
                <option value="4">Financeiro</option>
                <option value="5">Administrativo</option>
            </select>
        </div>
        <div class="col-1fr-1fr">
            <div class="field">
                <label>E-mail</label>
                <input id="email" type="email" required />
            </div>
            <div class="field">
                <label>Telefone</label>
                <input id="telefone" type="text" maxlength="15" required />
            </div>
        </div>
        <div class="col-1fr-200px">
            <div class="field">
                <label class="cpfcnpj-label">CPF</label>
                <input id="cpf_cnpj" type="text" required />
            </div>
            <div class="switch-container">
                <span>CPF</span>
                <label class="switch">
                    <input class="cpfcnpj-switch" type="checkbox">
                    <span class="slider"></span>
                </label>                
                <span>CNPJ</span>
            </div>
        </div>
        <button class="submit" type="submit">Salvar colaborador</button>
    </form>
</div>
<script src="js/novoColaborador.js"></script>
